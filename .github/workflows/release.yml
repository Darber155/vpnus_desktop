name: release

# Сборка дистрибутивов и публикация GitHub Release по тегу v*.
#   git tag v1.0.1
#   git push origin v1.0.1

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия без v (например 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $v = '${{ github.event.inputs.version }}'
          } else {
            $v = '${{ github.ref_name }}'.TrimStart('v')
          }
          "value=$v" >> $env:GITHUB_OUTPUT
          Write-Host "version=$v"

      - name: Tests
        run: dotnet test tests\VpnUs.Core.Tests\VpnUs.Core.Tests.csproj -c Release --nologo

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Build packages (x64 + arm64)
        shell: pwsh
        run: |
          .\build\build-packages.ps1 -Version ${{ steps.version.outputs.value }} -Runtimes win-x64,win-arm64

      - name: List dist
        shell: pwsh
        run: Get-ChildItem dist | Select-Object Name, @{n='MB';e={[Math]::Round($_.Length/1MB,1)}}

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.version.outputs.value }}"
          $assets = Get-ChildItem dist -File | Where-Object { $_.Name -like 'VpnUs-*' }
          if ($assets.Count -eq 0) { throw "нет файлов в dist" }

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "VpnUs ${{ steps.version.outputs.value }}" --notes "Автосборка $tag" --verify-tag
          }

          # GitHub иногда отвечает 5xx при параллельной загрузке крупных файлов, поэтому
          # грузим строго последовательно и с повторами.
          foreach ($asset in $assets) {
            $ok = $false
            for ($i = 1; $i -le 5 -and -not $ok; $i++) {
              gh release upload $tag $asset.FullName --clobber
              $ok = $LASTEXITCODE -eq 0
              if (-not $ok) {
                Write-Host "повтор $i для $($asset.Name)"
                Start-Sleep -Seconds 10
              }
            }
            if (-not $ok) { throw "не удалось загрузить $($asset.Name)" }
            Write-Host "загружен $($asset.Name)"
          }
