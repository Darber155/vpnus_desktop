name: release

# Сборка дистрибутивов и публикация GitHub Release по тегу v*.
#   git tag v1.0.1
#   git push origin v1.0.1

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия без v (например 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $v = '${{ github.event.inputs.version }}'
          } else {
            $v = '${{ github.ref_name }}'.TrimStart('v')
          }
          "value=$v" >> $env:GITHUB_OUTPUT
          Write-Host "version=$v"

      - name: Tests
        run: dotnet test tests\VpnUs.Core.Tests\VpnUs.Core.Tests.csproj -c Release --nologo

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Build packages (x64 + arm64)
        shell: pwsh
        run: |
          .\build\build-packages.ps1 -Version ${{ steps.version.outputs.value }} -Runtimes win-x64,win-arm64

      - name: List dist
        shell: pwsh
        run: Get-ChildItem dist | Select-Object Name, @{n='MB';e={[Math]::Round($_.Length/1MB,1)}}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: VpnUs ${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: |
            dist/VpnUs-Setup-*-x64.exe
            dist/VpnUs-Setup-*-arm64.exe
            dist/VpnUs-portable-*-x64.zip
            dist/VpnUs-portable-*-arm64.zip
